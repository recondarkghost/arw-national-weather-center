<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARW U.S. NEXRAD Radar</title>
<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#07151e;color:#edf7ff;font:14px system-ui}
header{padding:14px}
h3{margin:0;color:#61edd7;font-size:21px}
p{line-height:1.4;margin:8px 0}
#map{height:430px;background:#172c37}
.controls{padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,a.button{
 background:#123b4d;color:white;border:1px solid #4c8194;
 padding:10px;border-radius:6px;cursor:pointer;text-decoration:none
}
button:disabled{opacity:.45}
#timeline{width:100%;accent-color:#61edd7}
#status{padding:0 12px 14px;line-height:1.5}
a{color:#82dfed}
</style>
</head>
<body>
<header>
<h3>ARW U.S. NEXRAD Radar</h3>
<p>Interactive reflectivity radar for the contiguous United States.
Drag, zoom, or play the recent loop. Coverage gaps do not mean clear weather.</p>
</header>

<div id="map" aria-label="Interactive U.S. NEXRAD radar"></div>

<div class="controls">
<button id="us">United States</button>
<button id="fl">Florida</button>
<button id="play" disabled>Play</button>
<button id="refresh">Refresh</button>
<label>Speed
<select id="speed">
<option value="1400">Slow</option>
<option value="900" selected>Normal</option>
<option value="500">Fast</option>
</select>
</label>
<a class="button" href="https://radar.weather.gov/"
 target="_blank" rel="noopener">Official NWS Radar</a>
<input id="timeline" type="range" min="0" max="11" value="11"
 aria-label="Radar timeline: oldest to latest">
</div>

<div id="status" role="status">Loading U.S. NEXRAD radar...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);

if(!window.L){
 $("status").textContent="Map library unavailable. Reload the page.";
 return;
}

const map=L.map("map",{
 minZoom:3,maxZoom:12,scrollWheelZoom:true
});
map.fitBounds([[24,-125],[50,-66]]);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
 maxZoom:19,
 attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

map.attributionControl.addAttribution(
 'NEXRAD mosaic: <a href="https://mesonet.agron.iastate.edu/docs/nexrad_mosaic/" target="_blank" rel="noopener">Iowa State IEM</a>'
);

let radar=null;
let busy=false;
let playing=false;
let timer=null;
let index=11;
let epoch=Date.now();
const ages=[55,50,45,40,35,30,25,20,15,10,5,0];

function pause(){
 playing=false;
 clearTimeout(timer);
 $("play").textContent="Play";
}

function schedule(){
 clearTimeout(timer);
 if(playing&&!busy&&!document.hidden){
  timer=setTimeout(
   ()=>show((index+1)%ages.length),
   Number($("speed").value)
  );
 }
}

function show(i){
 if(busy)return;
 busy=true;

 const age=ages[i];
 const name="nexrad-n0q"+
  (age?"-m"+String(age).padStart(2,"0")+"m":"");

 let errors=0;
 let done=false;

 const layer=L.tileLayer(
  "https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/"+
  name+"/{z}/{x}/{y}.png?v="+Math.floor(epoch/300000),
  {
   opacity:0,zIndex:10,maxNativeZoom:9,maxZoom:12,
   bounds:[[23,-126],[51,-65]]
  }
 );

 const timeout=setTimeout(()=>finish(false),20000);

 function finish(ok){
  if(done)return;
  done=true;
  clearTimeout(timeout);
  busy=false;

  if(!ok||errors){
   map.removeLayer(layer);
   pause();
   $("status").textContent=
    "Radar tiles unavailable. Previous image retained; "+
    "use Refresh or Official NWS Radar.";
   return;
  }

  layer.setOpacity(.8);
  if(radar)map.removeLayer(radar);
  radar=layer;
  index=i;
  $("timeline").value=i;

  $("status").textContent=
   "NEXRAD "+
   (age?age+" minutes before the latest mosaic":"latest mosaic")+
   " | Loaded "+new Date().toLocaleTimeString()+
   ". Observation times vary; refreshes every 5 minutes.";

  $("play").disabled=false;
  schedule();
 }

 layer.on("tileerror",()=>errors++);
 layer.once("load",()=>finish(true));
 layer.addTo(map);
}

$("play").onclick=()=>{
 if(playing){
  pause();
 }else{
  playing=true;
  $("play").textContent="Pause";
  schedule();
 }
};

$("timeline").oninput=()=>{
 pause();
 show(Number($("timeline").value));
};

$("speed").onchange=schedule;

$("refresh").onclick=()=>{
 pause();
 epoch=Date.now();
 show(11);
};

$("us").onclick=()=>map.fitBounds([[24,-125],[50,-66]]);
$("fl").onclick=()=>map.setView([28,-82],6);

document.addEventListener("visibilitychange",()=>{
 if(document.hidden){
  pause();
 }else{
  epoch=Date.now();
  show(11);
 }
});

setInterval(()=>{
 if(!document.hidden&&!busy&&!playing){
  epoch=Date.now();
  show(11);
 }
},300000);

window.addEventListener("resize",()=>map.invalidateSize());
show(11);
})();
</script>
</body>
</html>
